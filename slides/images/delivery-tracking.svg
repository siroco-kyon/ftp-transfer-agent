<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="宛先がダウンしても未配信の宛先だけ再送する配信トラッキングの図">
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b548c"/>
    </marker>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b548c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Run 1 -->
  <g filter="url(#shadow2)">
    <rect x="30" y="30" width="900" height="150" rx="14" fill="#fff7f1" stroke="#e08e45" stroke-width="2"/>
  </g>
  <text x="56" y="66" font-size="20" font-weight="bold" fill="#9a5b1f">1回目 — 大阪がメンテで停止中</text>

  <rect x="60" y="86" width="190" height="64" rx="10" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2"/>
  <text x="155" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f7a57">本番(primary)</text>
  <text x="155" y="138" text-anchor="middle" font-size="18" fill="#0f7a57">✅ 成功</text>

  <rect x="270" y="86" width="190" height="64" rx="10" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2"/>
  <text x="365" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f7a57">東京</text>
  <text x="365" y="138" text-anchor="middle" font-size="18" fill="#0f7a57">✅ 成功</text>

  <rect x="480" y="86" width="190" height="64" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="575" y="114" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">大阪</text>
  <text x="575" y="138" text-anchor="middle" font-size="18" fill="#c0392b">❌ 停止中</text>

  <rect x="700" y="86" width="210" height="64" rx="10" fill="#ffffff" stroke="#9a5b1f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="805" y="110" text-anchor="middle" font-size="15" fill="#9a5b1f">成功した2宛先を記録</text>
  <text x="805" y="134" text-anchor="middle" font-size="15" fill="#9a5b1f">ファイルは保持（消さない）</text>

  <!-- arrow down -->
  <path d="M480,196 L480,232" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="500" y="220" font-size="15" fill="#0b548c" font-weight="bold">大阪が復旧 → 次回起動</text>

  <!-- Run 2 -->
  <g filter="url(#shadow2)">
    <rect x="30" y="244" width="900" height="150" rx="14" fill="#f1f8f4" stroke="#0f7a57" stroke-width="2"/>
  </g>
  <text x="56" y="280" font-size="20" font-weight="bold" fill="#0f7a57">2回目 — 大阪が復旧</text>

  <rect x="60" y="300" width="190" height="64" rx="10" fill="#f4f8fb" stroke="#9aa7b2" stroke-width="1.5"/>
  <text x="155" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#5a6b7b">本番・東京</text>
  <text x="155" y="352" text-anchor="middle" font-size="15" fill="#5a6b7b">配信済み → 送らない</text>

  <rect x="270" y="300" width="190" height="64" rx="10" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2.5"/>
  <text x="365" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f7a57">大阪</text>
  <text x="365" y="352" text-anchor="middle" font-size="18" fill="#0f7a57">✅ ここだけ再送</text>

  <rect x="490" y="300" width="420" height="64" rx="10" fill="#ffffff" stroke="#0f7a57" stroke-width="1.5"/>
  <text x="700" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f7a57">全宛先そろった = 完了</text>
  <text x="700" y="350" text-anchor="middle" font-size="15" fill="#1f2f3d">ローカル削除・記録も掃除（何も残らない）</text>
</svg>
