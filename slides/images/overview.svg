<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="ローカルフォルダから FtpTransferAgent を通して FTP/SFTP サーバーへ、転送・検証・ログ付きで送る概要図">
  <defs>
    <marker id="ov-arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b548c"/>
    </marker>
    <filter id="ov-shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b548c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- label above the arrows -->
  <g filter="url(#ov-shadow)">
    <rect x="320" y="12" width="320" height="44" rx="22" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2"/>
  </g>
  <text x="480" y="41" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f7a57">転送 ＋ 検証 ＋ ログ</text>

  <!-- box 1: local folder -->
  <g filter="url(#ov-shadow)">
    <rect x="20" y="92" width="250" height="84" rx="12" fill="#f4f8fb" stroke="#15729e" stroke-width="2.5"/>
  </g>
  <text x="145" y="128" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2f3d">ローカルフォルダ</text>
  <text x="145" y="154" text-anchor="middle" font-size="15" fill="#5a6b7b">監視 / 保存フォルダ</text>

  <!-- box 2: the agent (emphasized) -->
  <g filter="url(#ov-shadow)">
    <rect x="355" y="84" width="250" height="100" rx="12" fill="#eaf4ee" stroke="#0f7a57" stroke-width="3"/>
  </g>
  <text x="480" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f7a57">FtpTransferAgent</text>
  <text x="480" y="152" text-anchor="middle" font-size="15" fill="#5a6b7b">.NET 10 バッチ</text>

  <!-- box 3: remote server -->
  <g filter="url(#ov-shadow)">
    <rect x="690" y="92" width="250" height="84" rx="12" fill="#ffffff" stroke="#0b548c" stroke-width="2.5"/>
  </g>
  <text x="815" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b548c">FTP / SFTP サーバー</text>
  <text x="815" y="154" text-anchor="middle" font-size="15" fill="#5a6b7b">連携先</text>

  <!-- arrows -->
  <path d="M272,134 L351,134" fill="none" stroke="#0b548c" stroke-width="3" marker-end="url(#ov-arrow)"/>
  <path d="M607,134 L686,134" fill="none" stroke="#0b548c" stroke-width="3" marker-end="url(#ov-arrow)"/>
</svg>
