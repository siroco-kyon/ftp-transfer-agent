<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="設定ファイルがオプションに束縛され二段階で検証される流れの図">
  <defs>
    <marker id="arO" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b548c"/>
    </marker>
    <filter id="shO" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b548c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b548c">設定は「型」に変換し、起動時に二段階で検証する</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5a6b7b">間違った設定で動き出して途中で失敗するより、起動した瞬間に止める方が安全（フェイルファスト）</text>

  <!-- json -->
  <g filter="url(#shO)"><rect x="30" y="100" width="190" height="150" rx="12" fill="#ffffff" stroke="#0b548c" stroke-width="2"/></g>
  <text x="125" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b548c">appsettings.json</text>
  <text x="46" y="152" font-size="11.5" fill="#1f2f3d">"Transfer": {</text>
  <text x="56" y="170" font-size="11.5" fill="#1f2f3d">"Mode": "sftp",</text>
  <text x="56" y="188" font-size="11.5" fill="#1f2f3d">"Direction": "put",</text>
  <text x="56" y="206" font-size="11.5" fill="#1f2f3d">"Concurrency": 8</text>
  <text x="46" y="224" font-size="11.5" fill="#1f2f3d">}</text>

  <!-- options -->
  <g filter="url(#shO)"><rect x="280" y="100" width="200" height="150" rx="12" fill="#eef5fa" stroke="#15729e" stroke-width="2"/></g>
  <text x="380" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#15729e">TransferOptions（型）</text>
  <text x="296" y="152" font-size="11.5" fill="#1f2f3d">[Required]</text>
  <text x="296" y="170" font-size="11.5" fill="#1f2f3d">[RegularExpression]</text>
  <text x="296" y="188" font-size="11.5" fill="#1f2f3d">string Mode;</text>
  <text x="296" y="212" font-size="11.5" fill="#1f2f3d">[Range(1,16)]</text>
  <text x="296" y="230" font-size="11.5" fill="#1f2f3d">int Concurrency;</text>
  <text x="380" y="120" font-size="11" fill="#15729e"></text>
  <text x="250" y="180" text-anchor="middle" font-size="11" fill="#5a6b7b">Bind</text>
  <path d="M222,175 L276,175" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#arO)"/>

  <!-- validation 1 -->
  <g filter="url(#shO)"><rect x="540" y="86" width="200" height="86" rx="12" fill="#ffffff" stroke="#15729e" stroke-width="2"/></g>
  <text x="640" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#15729e">① DataAnnotations</text>
  <text x="640" y="134" text-anchor="middle" font-size="11.5" fill="#1f2f3d">1 項目ずつの形式チェック</text>
  <text x="640" y="152" text-anchor="middle" font-size="11.5" fill="#1f2f3d">（必須 / 範囲 / 正規表現）</text>

  <!-- validation 2 -->
  <g filter="url(#shO)"><rect x="540" y="184" width="200" height="96" rx="12" fill="#fff4e6" stroke="#e08e45" stroke-width="2"/></g>
  <text x="640" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5b1f">② ConfigurationValidator</text>
  <text x="640" y="232" text-anchor="middle" font-size="11.5" fill="#1f2f3d">項目をまたぐ整合・安全性</text>
  <text x="640" y="250" text-anchor="middle" font-size="11.5" fill="#1f2f3d">（FTP 平文警告 / 鍵の有無 /</text>
  <text x="640" y="268" text-anchor="middle" font-size="11.5" fill="#1f2f3d">上書き衝突 / 宛先一意性…）</text>

  <path d="M482,150 L536,128" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#arO)"/>
  <path d="M482,200 L536,224" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#arO)"/>

  <!-- outcome -->
  <g filter="url(#shO)"><rect x="780" y="120" width="150" height="60" rx="10" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2"/></g>
  <text x="855" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f7a57">OK → 実行へ</text>
  <text x="855" y="166" text-anchor="middle" font-size="11.5" fill="#1f2f3d">警告は表示して続行</text>

  <g filter="url(#shO)"><rect x="780" y="196" width="150" height="60" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/></g>
  <text x="855" y="222" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">エラー → 即終了</text>
  <text x="855" y="242" text-anchor="middle" font-size="11.5" fill="#1f2f3d">終了コード 1</text>

  <path d="M742,128 L776,142" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#arO)"/>
  <path d="M742,232 L776,224" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#arO)"/>

  <text x="30" y="312" font-size="13" fill="#1f2f3d">①は <tspan font-weight="bold" fill="#15729e">Program.cs の ValidateDataAnnotations().ValidateOnStart()</tspan>、②は <tspan font-weight="bold" fill="#9a5b1f">host.Build() 直後の validator.ValidateConfiguration()</tspan>。</text>
  <text x="30" y="336" font-size="12.5" fill="#5a6b7b">「1 項目の形式」と「項目どうしの組み合わせ」は別物なので、検証も二層に分けている。</text>
</svg>
