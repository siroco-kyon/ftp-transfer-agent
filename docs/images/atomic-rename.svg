<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="一時ファイル名で送ってから正式名へリネームするアトミック転送の図">
  <defs>
    <marker id="arT" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b548c"/>
    </marker>
    <filter id="shT" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b548c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b548c">「中途半端なファイルを相手に見せない」アトミック転送</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#5a6b7b">転送中は相手のバッチが拾わない一時名。完了＋検証 OK の瞬間だけ正式名にリネーム（一瞬の操作）</text>

  <!-- step 1 -->
  <g filter="url(#shT)"><rect x="40" y="90" width="260" height="180" rx="12" fill="#ffffff" stroke="#0b548c" stroke-width="2"/></g>
  <text x="170" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b548c">① 一時名で送信中</text>
  <rect x="70" y="140" width="200" height="34" rx="6" fill="#eef5fa" stroke="#15729e"/>
  <text x="170" y="162" text-anchor="middle" font-size="12.5" fill="#15729e">data.csv.tmp.9af3…</text>
  <text x="170" y="200" text-anchor="middle" font-size="12.5" fill="#1f2f3d">相手のバッチは</text>
  <text x="170" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a5b1f">この名前を拾わない</text>
  <text x="170" y="248" text-anchor="middle" font-size="11.5" fill="#5a6b7b">＝書きかけを誤って取り込まない</text>

  <!-- step 2 -->
  <g filter="url(#shT)"><rect x="350" y="90" width="260" height="180" rx="12" fill="#ffffff" stroke="#0b548c" stroke-width="2"/></g>
  <text x="480" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b548c">② ハッシュ検証</text>
  <text x="480" y="150" text-anchor="middle" font-size="12.5" fill="#1f2f3d">ローカル hash</text>
  <text x="480" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#15729e">a1b2c3…</text>
  <text x="480" y="196" text-anchor="middle" font-size="14" fill="#0f7a57">＝ 一致するか</text>
  <text x="480" y="220" text-anchor="middle" font-size="12.5" fill="#1f2f3d">リモート hash</text>
  <text x="480" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#15729e">a1b2c3…</text>

  <!-- step 3 -->
  <g filter="url(#shT)"><rect x="660" y="90" width="260" height="180" rx="12" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2.5"/></g>
  <text x="790" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f7a57">③ 正式名へリネーム</text>
  <rect x="690" y="140" width="200" height="34" rx="6" fill="#ffffff" stroke="#0f7a57"/>
  <text x="790" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f7a57">data.csv</text>
  <text x="790" y="200" text-anchor="middle" font-size="12.5" fill="#1f2f3d">リネームは一瞬</text>
  <text x="790" y="220" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f7a57">「半分だけの data.csv」は</text>
  <text x="790" y="240" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0f7a57">存在しない</text>

  <path d="M302,180 L348,180" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#arT)"/>
  <path d="M612,180 L658,180" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#arT)"/>
  <text x="325" y="172" text-anchor="middle" font-size="11" fill="#5a6b7b">完了</text>
  <text x="635" y="172" text-anchor="middle" font-size="11" fill="#5a6b7b">OK</text>

  <text x="40" y="310" font-size="13" fill="#1f2f3d">検証に <tspan font-weight="bold" fill="#9a5b1f">失敗</tspan> したら正式名にしない（リトライ or 失敗扱い）。SFTP は posix-rename 拡張があれば <tspan font-weight="bold" fill="#0f7a57">既存ファイルも原子的に置換</tspan>。</text>
  <text x="40" y="334" font-size="13" fill="#1f2f3d">検証に通るまで「成功後の削除」も行わない＝<tspan font-weight="bold" fill="#0f7a57">消してから気づく事故が起きない</tspan>。</text>
  <text x="40" y="358" font-size="12" fill="#5a6b7b">実装: SftpClientWrapper.UploadAsync / AsyncFtpClientWrapper.UploadAsync（temp 名 → Rename/Move）, Worker.UploadPathWithHashAsync（hash 比較）</text>
</svg>
