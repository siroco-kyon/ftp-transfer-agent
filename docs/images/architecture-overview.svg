<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="'BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif" role="img" aria-label="FtpTransferAgent の全体アーキテクチャ図">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0b548c"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b548c" flood-opacity="0.18"/>
    </filter>
  </defs>

  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#0b548c">FtpTransferAgent ぜんたい地図</text>
  <text x="490" y="54" text-anchor="middle" font-size="13" fill="#5a6b7b">起動 → 設定読込・検証 → ロック取得 → Worker が転送 → 終了コードで結果を返す（常駐しない「バッチ型」）</text>

  <!-- Program.cs -->
  <g filter="url(#sh)"><rect x="30" y="80" width="200" height="120" rx="12" fill="#ffffff" stroke="#0b548c" stroke-width="2.5"/></g>
  <text x="130" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#0b548c">Program.cs</text>
  <text x="130" y="130" text-anchor="middle" font-size="12.5" fill="#1f2f3d">① ホスト構築 / DI 登録</text>
  <text x="130" y="150" text-anchor="middle" font-size="12.5" fill="#1f2f3d">② 設定の検証</text>
  <text x="130" y="170" text-anchor="middle" font-size="12.5" fill="#1f2f3d">③ 二重起動ロック</text>
  <text x="130" y="190" text-anchor="middle" font-size="12.5" fill="#1f2f3d">④ host.Run()</text>

  <!-- config -->
  <g filter="url(#sh)"><rect x="30" y="230" width="200" height="86" rx="12" fill="#eef5fa" stroke="#15729e" stroke-width="2"/></g>
  <text x="130" y="256" text-anchor="middle" font-size="14" font-weight="bold" fill="#15729e">Configuration</text>
  <text x="130" y="278" text-anchor="middle" font-size="12" fill="#1f2f3d">appsettings.json →</text>
  <text x="130" y="296" text-anchor="middle" font-size="12" fill="#1f2f3d">Options + 起動時バリデーション</text>

  <path d="M130,230 L130,200" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Worker -->
  <g filter="url(#sh)"><rect x="290" y="80" width="220" height="236" rx="12" fill="#eaf4ee" stroke="#0f7a57" stroke-width="2.5"/></g>
  <text x="400" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f7a57">Worker.cs（司令塔）</text>
  <text x="400" y="132" text-anchor="middle" font-size="12.5" fill="#1f2f3d">列挙 → 計画 → 投入 → 集約</text>
  <g fill="#ffffff" stroke="#0f7a57" stroke-width="1.5">
    <rect x="310" y="146" width="180" height="34" rx="7"/>
    <rect x="310" y="188" width="180" height="34" rx="7"/>
    <rect x="310" y="230" width="180" height="34" rx="7"/>
    <rect x="310" y="272" width="180" height="34" rx="7"/>
  </g>
  <text x="400" y="168" text-anchor="middle" font-size="12.5" fill="#1f2f3d">ファイル列挙 / END 判定</text>
  <text x="400" y="210" text-anchor="middle" font-size="12.5" fill="#1f2f3d">未送先だけ計画（差分）</text>
  <text x="400" y="252" text-anchor="middle" font-size="12.5" fill="#1f2f3d">ハッシュ検証付き転送</text>
  <text x="400" y="294" text-anchor="middle" font-size="12.5" fill="#1f2f3d">完了後の削除 / retry / 通知</text>

  <path d="M230,140 L286,140" fill="none" stroke="#0b548c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="258" y="132" text-anchor="middle" font-size="11" fill="#5a6b7b">起動</text>

  <!-- per-destination lines -->
  <text x="690" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b548c">宛先ごとに独立した処理ライン</text>
  <g filter="url(#sh)"><rect x="560" y="86" width="260" height="64" rx="10" fill="#ffffff" stroke="#0b548c" stroke-width="2"/></g>
  <text x="690" y="110" text-anchor="middle" font-size="12.5" fill="#1f2f3d">Channel → TransferQueue（ワーカー×N）</text>
  <text x="690" y="130" text-anchor="middle" font-size="12.5" fill="#1f2f3d">→ ClientPool（接続再利用）</text>

  <g filter="url(#sh)"><rect x="560" y="160" width="260" height="64" rx="10" fill="#ffffff" stroke="#0b548c" stroke-width="2"/></g>
  <text x="690" y="184" text-anchor="middle" font-size="12.5" fill="#1f2f3d">Channel → TransferQueue（ワーカー×N）</text>
  <text x="690" y="204" text-anchor="middle" font-size="12.5" fill="#1f2f3d">→ ClientPool（接続再利用）</text>

  <g filter="url(#sh)"><rect x="560" y="234" width="260" height="64" rx="10" fill="#ffffff" stroke="#0b548c" stroke-width="2"/></g>
  <text x="690" y="258" text-anchor="middle" font-size="12.5" fill="#1f2f3d">Channel → TransferQueue（ワーカー×N）</text>
  <text x="690" y="278" text-anchor="middle" font-size="12.5" fill="#1f2f3d">→ ClientPool（接続再利用）</text>

  <path d="M510,140 L556,118" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M510,180 L556,192" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M510,230 L556,266" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- servers -->
  <g fill="#eef5fa" stroke="#15729e" stroke-width="2">
    <rect x="860" y="92" width="92" height="52" rx="8"/>
    <rect x="860" y="166" width="92" height="52" rx="8"/>
    <rect x="860" y="240" width="92" height="52" rx="8"/>
  </g>
  <text x="906" y="123" text-anchor="middle" font-size="12.5" fill="#15729e">primary</text>
  <text x="906" y="197" text-anchor="middle" font-size="12.5" fill="#15729e">大阪</text>
  <text x="906" y="271" text-anchor="middle" font-size="12.5" fill="#15729e">東京</text>
  <path d="M820,118 L856,118" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M820,192 L856,192" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M820,266 L856,266" fill="none" stroke="#0b548c" stroke-width="2" marker-end="url(#ar)"/>

  <!-- coordinator + state -->
  <g filter="url(#sh)"><rect x="560" y="330" width="260" height="58" rx="10" fill="#fff4e6" stroke="#e08e45" stroke-width="2"/></g>
  <text x="690" y="354" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5b1f">FanoutCoordinator</text>
  <text x="690" y="374" text-anchor="middle" font-size="12" fill="#9a5b1f">全宛先の結果を集約 → 1回だけ後始末</text>
  <path d="M690,298 L690,328" fill="none" stroke="#e08e45" stroke-width="2" marker-end="url(#ar)"/>

  <g filter="url(#sh)"><rect x="290" y="350" width="220" height="58" rx="10" fill="#fff4e6" stroke="#e08e45" stroke-width="2"/></g>
  <text x="400" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a5b1f">DeliveryStateStore</text>
  <text x="400" y="394" text-anchor="middle" font-size="12" fill="#9a5b1f">マーカーで「どこまで送れたか」を永続化</text>
  <path d="M400,316 L400,348" fill="none" stroke="#e08e45" stroke-width="2" marker-end="url(#ar)"/>

  <!-- cross-cutting -->
  <g filter="url(#sh)"><rect x="30" y="440" width="920" height="58" rx="10" fill="#ffffff" stroke="#0b548c" stroke-width="1.5"/></g>
  <text x="48" y="464" font-size="13" font-weight="bold" fill="#0b548c">横断的な仕組み：</text>
  <text x="48" y="485" font-size="12.5" fill="#1f2f3d">Polly リトライ（指数バックオフ） ・ RetryableExceptionClassifier（再試行可否） ・ HashUtil（整合性） ・ RollingFileLogger / ErrorEmailLogger（証跡・通知） ・ ProcessLock（二重起動防止）</text>
</svg>
